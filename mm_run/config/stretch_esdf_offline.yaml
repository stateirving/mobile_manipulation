# nvblox ESDF hard-constraint MPC validation.
# Compile the matching acados solver with generate_acados_code.py before running.

planner:
  tasks:

    - name: ESDF Aisle Entry
      planner_type: WaypointPlanner
      base_pose: [0.5, -1.5, -0.7854]
      base_mask: [true, true, true]
      # ee_pose: [0.5, -1.0, 1.0, 0.0, 0.0, -0.0708]
      # ee_mask: [true, true, true, false, false, false]
      tracking_pos_err_tol: 0.2
      tracking_ori_err_tol: 0.20
      hold_period: 1.0
    - name: ESDF Aisle Entry
      planner_type: WaypointPlanner
      base_pose: [1.0, -2.0, -0.7854]
      base_mask: [true, true, true]
      # ee_pose: [0.5, -1.5, 1.0, 0.0, 0.0, -0.0708]
      # ee_mask: [true, true, true, false, false, false]
      tracking_pos_err_tol: 0.2
      tracking_ori_err_tol: 0.20
      hold_period: 1.0
    - name: ESDF Aisle Entry
      planner_type: WaypointPlanner
      base_pose: [1.5, -2.5, -0.7854]
      base_mask: [true, true, true]
      # ee_pose: [1.0, -2.0, 1.0, 0.0, 0.0, -0.0708]
      # ee_mask: [true, true, true, false, false, false]
      tracking_pos_err_tol: 0.2
      tracking_ori_err_tol: 0.20
      hold_period: 1.0

