# UR10 mobile manipulator with a holonomic planar base:
# [base x, base y, base yaw, six UR10 joints].

simulation:
  robot:
    # wrist_3=0 avoids an XYZ-Euler singularity at the standard arm pose.
    home: [0.0, 0.0, 0.0, 0.5pi, -0.25pi, 0.5pi, -0.25pi, 0.5pi, 0.0]
    dims:
      q: 9
      v: 9
      x: 18
      u: 9
    noise:
      measurement:
        q_std_dev: 0
        v_std_dev: 0
      process:
        v_std_dev: 0
    joint_names:
      - "x_to_world_joint"
      - "y_to_x_joint"
      - "base_to_y_joint"
      - "ur10_arm_shoulder_pan_joint"
      - "ur10_arm_shoulder_lift_joint"
      - "ur10_arm_elbow_joint"
      - "ur10_arm_wrist_1_joint"
      - "ur10_arm_wrist_2_joint"
      - "ur10_arm_wrist_3_joint"
    tool_joint_name: "gripped_object_joint"
    base_joint_name: "base_to_y_joint"
    tool_link_name: "gripped_object"
    base_link_name: "base"
    base_type: omnidirectional
    urdf:
      package: "mm_assets"
      path: "thing/urdf/thing_sim.urdf"
      includes:
        - "$(find mm_assets)/thing/xacro/cartesian_base_joints.urdf.xacro"
        - "$(find mm_assets)/thing/xacro/thing_no_wheels.urdf.xacro"
        - "$(find mm_assets)/thing/xacro/end_effector_empty.urdf.xacro"
      args:
        use_collision: "false"
        transform_params: "$(find mm_run)/config/robot/urdf_transforms.yaml"

controller:
  robot:
    dims:
      q: 9
      v: 9
      x: 18
      u: 9
    # MPC warm-start configuration in common controller coordinates.
    x0: [0.0, 0.0, 0.0, 0.5pi, -0.25pi, 0.5pi, -0.25pi, 0.5pi, 0.0]
    joint_names:
      - "ur10_arm_shoulder_pan_joint"
      - "ur10_arm_shoulder_lift_joint"
      - "ur10_arm_elbow_joint"
      - "ur10_arm_wrist_1_joint"
      - "ur10_arm_wrist_2_joint"
      - "ur10_arm_wrist_3_joint"

    limits:
      input:
        lower: [-1.0, -1.0, -0.75, -2.16, -2.16, -3.15, -3.2, -3.2, -3.2]
        upper: [1.0, 1.0, 0.75, 2.16, 2.16, 3.15, 3.2, 3.2, 3.2]
      state:
        lower: [-10.0, -10.0, -2pi, -2pi, -2pi, -2pi, -2pi, -2pi, -2pi,
                -1.0, -1.0, -0.4, -2.0, -2.0, -3.0, -3.0, -3.0, -3.0]
        upper: [10.0, 10.0, 2pi, 2pi, 2pi, 2pi, 2pi, 2pi, 2pi,
                1.0, 1.0, 0.4, 2.0, 2.0, 3.0, 3.0, 3.0, 3.0]
    time_discretization_dt: 0.1

    link_names:
      - "base"
      - "ur10_arm_base_link"
      - "ur10_arm_shoulder_link"
      - "ur10_arm_upper_arm_link"
      - "ur10_arm_forearm_link"
      - "ur10_arm_wrist_1_link"
      - "ur10_arm_wrist_2_link"
      - "ur10_arm_wrist_3_link"
      - "gripped_object"
    tool_link_name: "gripped_object"
    base_link_name: "base"
    base_type: omnidirectional
    tool_vicon_name: "ThingContainer"

