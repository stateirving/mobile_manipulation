# Offline ESDF + OMPL Cartesian planning + whole-body MPC for a UR10 mounted
# on a holonomic planar base.

planner:
  task_defaults:
    base:
      planner_type: OMPLBasePlanner
      base_mask: [true, true, true]
      bounds_xy: [[-4.0, 4.0], [-4.0, 4.0]]
      bounds_margin: 0.75
      tracking_pos_err_tol: 0.10
      tracking_ori_err_tol: 0.15
      hold_period: 1.0
      end_stop: false
      ompl:
        planner: "RRTstar"
        solve_time: 0.5
        solve_attempts: 3
        simplify: true
        simplify_time: 0.05
        range: 0.10
        goal_tolerance: 0.08
        state_validity_resolution: 0.01
      path:
        dt: 0.1
        linear_speed: 0.25
        angular_speed: 0.8
        interpolation_resolution: 0.05
        # Holonomic base can translate diagonally without turning to the path.
        yaw_mode: "interpolate"
      esdf:
        enabled: true
        # Circumscribed footprint of the 0.93 m x 0.79 m chassis.
        base_radius: 0.62
        query_z: [0.10, 0.23]
        d_safe: 0.05
        unknown_is_valid: false
        allow_straight_line_fallback: false
      replan:
        enabled: true
        validate_every_step: false
        validate_remaining_path: false
        min_interval: 1.0
        check_horizon: 2.0
        check_dt: 0.2
        min_clearance: 0.0
        deviation_threshold: 0.25
        force_periodic: false
        keep_previous_on_failure: true

    ee:
      planner_type: OMPLEEPlanner
      ee_mask: [true, true, true, false, false, false]
      bounds_xyz: [[0.2, 1.8], [-1.0, 1.0], [0.25, 1.5]]
      bounds_margin: 0.25
      tracking_pos_err_tol: 0.05
      tracking_ori_err_tol: 0.25
      hold_period: 1.0
      end_stop: false
      ompl:
        planner: "RRTConnect"
        solve_time: 0.5
        solve_attempts: 3
        simplify: true
        simplify_time: 0.05
        range: 0.12
        goal_tolerance: 0.04
        state_validity_resolution: 0.01
      path:
        dt: 0.1
        linear_speed: 0.12
        angular_speed: 0.8
        interpolation_resolution: 0.04
      esdf:
        enabled: true
        # A single point at the EE origin; the gripper itself is represented
        # by the five link-attached spheres in the MPC collision model.
        tool_radius: 0.05
        d_safe: 0.05
        unknown_is_valid: false
        allow_straight_line_fallback: true
      replan:
        enabled: true
        validate_every_step: false
        validate_remaining_path: false
        min_interval: 1.0
        check_horizon: 2.0
        check_dt: 0.2
        min_clearance: 0.0
        deviation_threshold: 0.25
        force_periodic: false
        keep_previous_on_failure: true

  tasks:
    # - defaults: base
    #   name: "OMPL Base To Work Area"
    #   base_pose: [2.0, -2.0, 0.0]

    - defaults: base
      name: "OMPL Base Goal 2"
      base_pose: [2.0, 0.0, 0.0]

    - defaults: ee
      name: "EE Approach"
      ee_pose: [3.5, -0.5, 0.85, 0.0, 0.0, -0.0708]

    - defaults: ee
      name: "EE Reach Low"
      ee_pose: [3.5, -0.5, 0.4, 0.0, 0.0, -0.0708]

    - defaults: ee
      name: "EE Reach Side"
      ee_pose: [3.5, 0.5, 0.4, 0.0, 0.0, -0.0708]

controller:
  cmd_vel_type: "integration"
  self_collision_avoidance_enabled: false
  static_obstacles_collision_avoidance_enabled: false
  self_collision_emergency_stop: false
  collision_emergency_stop_margin:
    self: 0.0
    static_obstacles: 0.0

  esdf_collision:
    enabled: true
    source: "offline"
    map_path:
      package: "mm_run"
      path: "results/nvblox_esdf/esdf_test_room_full_2cm_dense/2026-06-15_12-32-10/esdf_grid.npz"
    # Geometry-fitted spheres for the complete mobile manipulator.
    spheres:
      - "base_sphere_00"
      - "base_sphere_01"
      - "base_sphere_02"
      - "base_sphere_03"
      - "base_sphere_04"
      - "base_sphere_05"
      - "base_sphere_09"
      - "base_sphere_10"
      - "base_sphere_14"
      - "base_sphere_15"
      - "base_sphere_16"
      - "base_sphere_17"
      - "base_sphere_18"
      - "base_sphere_19"
      - "base_sphere_20"
      - "base_sphere_21"
      - "base_sphere_22"
      - "base_sphere_23"
      - "base_sphere_24"
      - "base_sphere_25"
      - "base_sphere_29"
      - "base_sphere_30"
      - "base_sphere_34"
      - "base_sphere_35"
      - "base_sphere_36"
      - "base_sphere_37"
      - "base_sphere_38"
      - "base_sphere_39"
      - "arch_sphere_00"
      - "arch_sphere_01"
