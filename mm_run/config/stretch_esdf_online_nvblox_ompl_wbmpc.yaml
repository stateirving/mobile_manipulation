# Online nvblox ESDF + OMPL base/EE planning + whole-body MPC.
#
# Reuse the offline OMPL planning/controller setup, then replace the ESDF map
# source with the online nvblox mapper and enable simulated depth integration.

include:
  - package: "mm_run"
    path: "config/stretch_esdf_offline_ompl_wbmpc.yaml"

planner:
  task_defaults:
    base:
      esdf:
        # The first plan is optimistic until the initial online scan has
        # observed enough of the workspace.
        unknown_is_valid: false
        allow_straight_line_fallback: false

    ee:
      bounds_xyz: [[-4.0, 4.0], [-4.0, 4.0], [0.25, 1.3]]
      esdf:
        unknown_is_valid: false
        allow_straight_line_fallback: false
      replan:
        min_interval: 2
        force_periodic: true

  tasks:
    - defaults: base
      name: "OMPL Base Goal 2"
      base_pose: [2.0, 0.0, 0.0]

    - defaults: base
      name: "OMPL Base To Work Area"
      base_pose: [2.0, -2.0, 0.0]

    - defaults: base
      name: "OMPL Base Goal 2"
      base_pose: [2.0, 0.0, 0.0]

    - defaults: ee
      name: "EE Approach"
      ee_pose: [3.0, -0.5, 0.85, 0.0, 0.0, -0.0708]

    - defaults: ee
      name: "EE Reach Low"
      ee_pose: [3.0, -0.5, 0.4, 0.0, 0.0, -0.0708]

    - defaults: ee
      name: "EE Reach Side"
      ee_pose: [3.0, 0.5, 0.4, 0.0, 0.0, -0.0708]

controller:
  esdf_collision:
    source: "online_nvblox"
    d_safe: 0.07
    soft_cost:
      p: 1.0
      mu: 1000.0
      smoothing: 5.0e-03
    online_nvblox:
      voxel_size: 0.01
      integrator_type: "tsdf"
      query_radius: 0.0
      auto_update_esdf: True
      update_esdf_on_depth: False
      unknown_distance_threshold: 50.0
      camera:
        fx: 147.802
        fy: 147.802
        cx: 255.5
        cy: 255.5
        width: 512
        height: 512

simulation:
  duration: 15.0

online_nvblox_sim:
  enabled: True
  renderer: "tiny"
  width: 512
  height: 512
  fov_y_deg: 120.0
  near: 0.25
  far: 2.88
  ground_filter_min_z: 0.01
  timing_log_interval_steps: 20
  exclude_robot: True
  exclude_collision_sphere_markers: True
  decay:
    enabled: False
    interval_steps: 3
  diagnostics:
    enabled: True
    base_sphere_name: "base_body_collision"
    unknown_distance: 100.0
    unknown_distance_tolerance: 1.0e-03
    target_link_names:
      - "desk_right_leg_fr"
      - "desk_right_leg_fl"
      - "desk_right_leg_br"
      - "desk_right_leg_bl"
  preview:
    enabled: false
    mode: "rgb_depth"
    window_name: "online nvblox simulated camera"
    show_initial_scan: False
    show_realtime_scan: True
    wait_ms: 1
    scale: 1.5
  initial_scan:
    enabled: true
    num_views: 12
    yaw_offset_deg: 2.5
    camera_heights: [1.0]
    update_esdf: true
    origins:
      - [0.0, 0.0, 0.0]
      - [0.5, -1.5, -0.7854]
      - [1.0, -2.0, -0.7854]
      - [1.5, -2.5, -0.7854]
  realtime_scan:
    enabled: true
    render_interval_steps: 3
    update_esdf: false
    cameras:
      - name: "head"
        pose_source: "camera_link"
        camera_link_name: "camera_depth_frame"
        camera_frame_convention: "ros_link"
        pose_correction_rpy: [0.0, 0.0, -1.5708]
      - name: "base"
        pose_source: "base_spin"
        num_views: 1
        camera_height: 0.45
        yaw_offset_deg: 0.0

logging:
  log_dir: "stretch_esdf_online_nvblox_ompl_wbmpc"
