stretch_wbmpc_shadow:
  # Resolved relative to this file both in the source tree and after install.
  controller_config: stretch_esdf_offline_ompl_wbmpc.yaml

  state_topic: /wbmpc/state
  velocity_command_topic: /wbmpc/velocity_command
  status_topic: /wbmpc/status
  global_frame: map

  control_rate: 7.0
  publish_rate: 20.0
  state_timeout: 0.25
