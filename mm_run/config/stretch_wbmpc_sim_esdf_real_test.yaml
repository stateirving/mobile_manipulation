stretch_wbmpc_shadow:
  controller_config: stretch_esdf_sim_real_commissioning.yaml

  state_topic: /wbmpc/state
  velocity_command_topic: /wbmpc/velocity_command
  status_topic: /wbmpc/status
  global_frame: map

  control_rate: 7.0
  publish_rate: 20.0
  state_timeout: 0.50
  # A result arriving after this wall-clock budget is discarded. The adapter
  # receives an invalid command envelope and performs base-zero/arm-hold.
  solver_deadline: 0.12
  plan_timeout: 0.20
  forward_prediction:
    enabled: true
    # Updated online only by successful, on-deadline controller cycles.
    expected_solver_time: 0.06
    adaptation_alpha: 0.10
    min_solver_time: 0.02
    max_solver_time: 0.12
    # Mean WB-MPC publisher + adapter dispatch delay on the same host.
    actuation_latency: 0.05
    max_prediction_time: 0.30
    constraint_tolerance: 0.01
  log_path: ""
