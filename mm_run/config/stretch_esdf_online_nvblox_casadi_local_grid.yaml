# Experimental online nvblox MPC config using a local CasADi ESDF interpolant.
#
# This includes stretch_esdf_online_nvblox.yaml and only overrides
# the ESDF backend/mode. Start with the coarse 10 cm local grid before trying
# 5 cm; the grid values become acados parameters at every horizon stage.

include:
  - package: "mm_run"
    path: "config/stretch_esdf_online_nvblox.yaml"

controller:
  esdf_collision:
    mode: "casadi_local_grid"
    local_grid:
      size_xy: [1.0, 1.0]
      z_range: [0.0, 1.2]
      voxel_size: 0.05
      center: "base"
      invalid_distance: -1.0
      clamp_to_grid: True

  acados:
    name: "StretchESDFCasadiLocalGrid"

logging:
  log_dir: "stretch_esdf_online_nvblox_casadi_local_grid"
