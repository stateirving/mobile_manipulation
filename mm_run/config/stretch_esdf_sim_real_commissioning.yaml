planner:
  tasks:
    - defaults: base
      name: "Real Test"
      base_pose: [1.0, 0.0, 0.0]
    - defaults: ee
      name: "EE Approach"
      ee_pose: [1.0, 0.0, 0.9, 0.0, 0.0, -0.0708]

controller:
  esdf_collision:
    source: "offline"
    map_path:
      package: "mm_run"
      path: "results/nvblox_esdf/esdf_test_room_full_2cm_dense/2026-06-15_12-32-10/esdf_grid.npz"
