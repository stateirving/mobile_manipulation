# Hardware-in-the-loop commissioning profile using the complete simulated room
# ESDF. This map is a virtual constraint only; it does not represent obstacles
# around the physical robot.
include:
  - package: "mm_run"
    path: "config/stretch_esdf_offline_ompl_wbmpc.yaml"

